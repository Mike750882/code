name: SpellWell
options:
  bundleIdPrefix: com.cdm
  deploymentTarget:
    iOS: "17.0"
targets:
  SpellWell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpellWell
    entitlements:
      path: SpellWell/SpellWell.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdm.SpellWell
        PRODUCT_NAME: "Spell With Speagle"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # A literal, hand-written Info.plist (SpellWell/Info.plist), not
        # GENERATE_INFOPLIST_FILE -- Xcode's auto-generated-from-build-
        # settings Info.plist silently drops idiom-specific ("~ipad") key
        # overrides, which broke the iPad orientations requirement for
        # App Store upload. Confirmed by inspecting a real archive's
        # compiled Info.plist: the ~ipad build setting was present in the
        # project file but never made it into the output. INFOPLIST_FILE
        # points straight at the file as-is, with none of XcodeGen's own
        # `info:` block generation/merging involved.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpellWell/Info.plist
  SpellWellUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpellWellUITests
    dependencies:
      - target: SpellWell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdm.SpellWellUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpellWell
schemes:
  SpellWell:
    build:
      targets:
        SpellWell: all
        SpellWellUITests: [test]
    test:
      targets:
        - SpellWellUITests
    run:
      config: Debug
    archive:
      config: Release
