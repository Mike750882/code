name: SpellWell
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
targets:
  SpellWell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpellWell
    entitlements:
      path: SpellWell/SpellWell.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.SpellWell
        PRODUCT_NAME: "Spell With Speagle"
        INFOPLIST_KEY_CFBundleDisplayName: "Spell With Speagle"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Spell With Speagle uses the microphone so a grown-up can record their own voice reading each spelling word."
        INFOPLIST_KEY_NSCameraUsageDescription: "Spell With Speagle uses the camera so a grown-up can take a photo of a spelling list to import it."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Spell With Speagle uses Face ID to verify it's a grown-up before resetting the PIN."
  SpellWellUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpellWellUITests
    dependencies:
      - target: SpellWell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.SpellWellUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpellWell
schemes:
  SpellWell:
    build:
      targets:
        SpellWell: all
        SpellWellUITests: [test]
    test:
      targets:
        - SpellWellUITests
    run:
      config: Debug
    archive:
      config: Release
