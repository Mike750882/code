name: SpellWell
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
targets:
  SpellWell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpellWell
    entitlements:
      path: SpellWell/SpellWell.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.SpellWell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SpellWell uses the microphone so a grown-up can record their own voice reading each spelling word."
        INFOPLIST_KEY_NSCameraUsageDescription: "SpellWell uses the camera so a grown-up can take a photo of a spelling list to import it."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "SpellWell uses Face ID to verify it's a grown-up before resetting the PIN."
